# Builds the app and publishes it with GitLab Pages on every push to the default branch.
image: node:20

pages:
  stage: deploy
  cache:
    key: npm
    paths:
      - .npm/
  script:
    - npm install --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
